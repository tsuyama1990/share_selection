# ==========================================
# Emin Yurumazu Investment Theory Screener
# ==========================================

# ------------------------------------------
# 1. gatekeeper: Fast Screening
# ------------------------------------------
# These filters calculate simple metrics from 'fast_info' or 'raw_data'
# to quickly exclude unqualified stocks.
gatekeeper:
  equity_ratio_min: 0.50       # Minimum Equity Ratio (0.50 = 50%)
  operating_margin_min: 0.05   # Minimum Operating Margin (0.05 = 5%)
  psr_cap: 1.2                 # Exclude stocks with PSR > 1.2
  operating_cash_flow_min: 0   # Operating Cash Flow > 0 (Positive)
  market_cap_min: 3000000000   # Minimum Market Cap (JPY): 3B JPY
  turnover_min: 30000000       # Minimum avg daily trading value (JPY): 30M JPY/day; order size of a few hundred thousand to a few million JPY
  turnover_days: 60            # Window (trading sessions) for the average daily trading value

# ------------------------------------------
# 2. indicators: Reported metrics
# ------------------------------------------
indicators:
  sales_cagr_years_back: 4     # Max look-back span (years) for the Sales CAGR
  sales_cagr_min_years: 3      # Min span (years) required; shorter history = no CAGR
  ma_short: 12                 # Months of the short moving average (output column MA<n>; keep output.columns in sync)
  ma_long: 24                  # Months of the long moving average (output column MA<n>)

  # Crash lows: name -> [start, end]
  # Output column: Downside_to_{Name}_Low(%)
  shock_lows:
    lehman: ['2008-09-01', '2009-03-31']
    corona: ['2020-02-01', '2020-04-30']

# ------------------------------------------
# 3b. improvement: stage 2 signs of improvement (computed for every ticker, also those failing the gatekeeper)
# ------------------------------------------
improvement:
  clear_threshold: 0.40             # YoY >= 40% (or EPS turnaround) -> "clear"; quarterly EPS decides, annual operating income only if EPS is unavailable
  same_quarter_tolerance_days: 20   # Same quarter a year earlier = 365 +- this many days before the latest quarter
  max_quarter_age_days: 200         # Ignore quarterly EPS when the latest quarter is older than this vs the price data end (newer quarters missing)

# ------------------------------------------
# 3b2. quality: stage 5 flags on one-off-driven EPS improvement (clear + quarterly-EPS decided only)
# ------------------------------------------
quality:
  max_quarter_share_of_annual: 0.5  # Latest quarterly EPS >= this share of latest annual Diluted EPS (> 0) -> quarter_spike; OI_YoY < 0 -> oi_divergence

# ------------------------------------------
# 3c. selection: stage 2 priority ranking
# ------------------------------------------
selection:
  candidates_n: 50                  # First N by Priority_Rank with Improvement_Class "clear" and no Quality_Flags are Stage2_Candidate

# ------------------------------------------
# 4. output: CSV report
# ------------------------------------------
output:
  dir: "results"                                   # Relative to the repo root (created if missing)
  filename: "emin_screening_result_{date}.csv"     # {date} = YYYY-MM-DD
  failures_filename: "fetch_failures_{date}.csv"   # Tickers `fetch` could not download, with the error (written to dir)
  columns:                                         # CSV columns, in order
    - Ticker
    - Priority_Rank
    - Stage2_Candidate
    - Next_Earnings_Date
    - Earnings_Period
    - Name
    - EPS_Q_YoY(%)
    - OI_YoY(%)
    - Op_Margin_Change(pt)
    - Improvement_Class
    - Improvement_Yield(%)
    - Quality_Flags
    - Current_Price
    - PSR
    - Real_PSR
    - PBR
    - Cash_to_MarketCap_Ratio
    - Net_Cash(Billion)
    - Dividend_Yield(%)
    - Sales_CAGR(%)
    - Sales_Growth_Years
    - Avg_Turnover(M JPY)
    - Operating_Cash_Flow
    - Investing_Cash_Flow
    - Financing_Cash_Flow
    - Chart_Trend
    - MA12
    - MA24
    - Downside_to_Lehman_Low(%)
    - Downside_to_Corona_Low(%)
    - Equity_Ratio
    - Operating_Margin(%)

# ------------------------------------------
# 5. tickers: JPX listed company list (`main.py tickers`)
# ------------------------------------------
tickers:
  jpx_url: "https://www.jpx.co.jp/markets/statistics-equities/misc/tvdivq0000001vg2-att/data_j.xlsx"  # Updated monthly
  timeout_s: 60                # Download timeout (seconds)
  markets:                     # Domestic common stocks only (excludes ETF/REIT/PRO Market/foreign stocks)
    - "プライム（内国株式）"
    - "スタンダード（内国株式）"
    - "グロース（内国株式）"

# ------------------------------------------
# 6. system: Files and data download
# ------------------------------------------
system:
  input_csv: "japan_tickers.csv" # List of tickers to screen
  sleep_time: 0.5                # Delay between API calls (seconds)
  cache_days: 3                  # Valid period for cached data (days)
  db_file: "stocks_cache.duckdb" # Database file
  daily_history_period: "1y"     # yfinance period of the daily history (turnover)
  market_timezone: "Asia/Tokyo" # Timezone of the history timestamps (bars are exposed as naive local dates)
  monthly_history_period: "max"  # yfinance period of the monthly history (trend, crash lows)

# ------------------------------------------
# 7. records: run records and outcome evaluation (`analyze` writes, `evaluate` reads)
# ------------------------------------------
records:
  db_file: "records.duckdb"      # Record database (separate from the cache; git-ignored)
  export_dir: "records"          # Parquet export per run: records/<run_id>/*.parquet (committed as the backup)
  shikiho_issue_months: [3, 6, 9, 12]  # Months with a Shikiho issue; the default --issue is the latest released one
  shikiho_release_day: 15               # Day of the month an issue is treated as released
  horizons_months: [6, 12]       # Outcome horizons measured from the run date
  benchmark_ticker: "1306.T"     # TOPIX ETF; excess return is relative to it
  price_lookback_days: 14        # History fetched before the earliest run, so a close "on or before t0" exists across holidays

# ------------------------------------------
# 8. calendar: JPX earnings announcement schedule (`main.py calendar` writes, `analyze` reads)
# ------------------------------------------
calendar:
  page_url: "https://www.jpx.co.jp/listing/event-schedules/financial-announcement/index.html"
  link_pattern: 'href="([^"]+\.xlsx)"'   # regex; group 1 = workbook link (one workbook per quarter-end month)
  user_agent: "Mozilla/5.0"              # JPX answers 403 to plain clients
  timeout_s: 60                          # Download timeout (seconds)
  out_csv: "earnings_calendar.csv"       # Merged calendar (git-ignored)

# ------------------------------------------
# 9. llm: stage 2 LLM calls (`main.py llm-check`). API keys come from the environment / .env, never from here
# ------------------------------------------
llm:
  timeout_s: 60                  # Per-request timeout (seconds)
  temperature: 0
  max_calls_per_minute: 20       # Shared across providers
  retries: 3                     # Extra attempts on the same provider after HTTP 429/5xx or a timeout (free tiers return 503 under load)
  retry_wait_s: 10               # Wait before retry n: retry_wait_s x n seconds
  providers:                     # Tried in this order; a provider whose key_env variable is empty is skipped
    # Free tier [2026-10-16]: gemini-3.5-flash-lite 379+ requests/day and 64k-token inputs, gemini-2.5-flash 20/day, Groq 8k tokens/min
    - {name: gemini-lite, base_url: "https://generativelanguage.googleapis.com/v1beta/openai", model: "gemini-3.5-flash-lite", key_env: GEMINI_API_KEY}
    - {name: gemini, base_url: "https://generativelanguage.googleapis.com/v1beta/openai", model: "gemini-2.5-flash", key_env: GEMINI_API_KEY}
    - {name: groq, base_url: "https://api.groq.com/openai/v1", model: "openai/gpt-oss-120b", key_env: GROQ_API_KEY}
    - {name: deepseek, base_url: "https://api.deepseek.com", model: "deepseek-v4-flash", key_env: DEEPSEEK_API_KEY}  # paid, last resort
  search:                        # Gemini native generateContent + google_search tool
    base_url: "https://generativelanguage.googleapis.com/v1beta"
    model: "gemini-2.5-flash"
    key_env: GEMINI_API_KEY
  check:                         # Prompts of `main.py llm-check`
    chat_prompt: "Reply with the single word: ok"
    search_prompt: "What is the Tokyo Stock Exchange's Prime Market? Answer in one sentence."

# ------------------------------------------
# 10. edinet: annual securities reports from EDINET API v2 (`main.py docs`). The key comes from the environment / .env
# ------------------------------------------
edinet:
  base_url: "https://api.edinet-fsa.go.jp/api/v2"
  key_env: EDINET_API_KEY        # Sent as the Subscription-Key query parameter (the API accepts no header)
  index_days: 450                # First run: filings of the last N days are indexed; later runs add the new days
  doc_type_code: "120"           # 120 = annual securities report (yuho)
  sections:                      # Text blocks stored per report (element names without the jpcrp_cor: prefix)
    - DescriptionOfBusinessTextBlock
    - BusinessPolicyBusinessEnvironmentIssuesToAddressEtcTextBlock
    - BusinessRisksTextBlock
    - NotesSegmentInformationEtcConsolidatedFinancialStatementsTextBlock
    - ManagementAnalysisOfFinancialPositionOperatingResultsAndCashFlowsTextBlock  # MD&A: where the company explains the profit change
  request_interval_s: 0.5        # Minimum time between requests (seconds)
  timeout_s: 60                  # Per-request timeout (seconds)

# ------------------------------------------
# 11. docstore: fetched documents for stage 2 research (`docs` writes)
# ------------------------------------------
docstore:
  db_file: "documents.duckdb"    # Documents, EDINET index and fetch errors (git-ignored; slow to rebuild, so kept)

# ------------------------------------------
# 12. webfetch: pages cited by the Gemini search (`docs` fetches the sources one by one)
# ------------------------------------------
webfetch:
  timeout_s: 30                  # Per-request timeout (seconds)
  max_bytes: 20000000            # A larger response is dropped as a failure
  user_agent: "share-selection-research/1.0"
  request_interval_s: 2          # Minimum time between page requests (seconds)

# ------------------------------------------
# 13. docs: web search part of `main.py docs` (needs the llm.search key)
# ------------------------------------------
docs:
  search: true                   # false: only the EDINET sections are collected
  max_sources: 5                 # Cited sources fetched per candidate
  search_prompt: >-
    {name}（証券コード{code}、東証上場）の最新の決算の結果、利益が増減した理由、
    および同社のIRページ・決算短信の掲載ページを調べてください。

# ------------------------------------------
# 14. review: stage 2 LLM research (`main.py review`, `review-eval`); `review` needs a passed `review-eval` for the first provider's model
# ------------------------------------------
review:
  max_tickers: 50                # Candidates reviewed per run (best Priority_Rank first; --tickers is not limited)
  min_verified_ratio: 0.7        # Verified claims / claims below this: the ticker needs attention (and fails review-eval)
  prompt_dir: "prompts"          # system.md, t1.md..t5.md, retry.md; their content hash is the prompt version (review-eval passes are per version and model)
  sources: [edinet, web]        # Document sources the review tasks use
  max_doc_chars: 20000           # Each document is cut to this many characters before the LLM sees it (and before quotes are checked)
  export_dir: "reviews"          # Parquet export of reviews and review_evals (git-ignored: quotes of web articles)
  context_metrics: ["Improvement_Class", "EPS_Q_YoY(%)", "OI_YoY(%)", "Op_Margin_Change(pt)", "Real_PSR", "PBR"]  # Stage 1 metrics shown to the LLM
  tasks:                         # Answer items per task, in the order the tasks run (the last one sees the verified answers of the others)
    T1: [source_type, demand_wave, tier, chokepoint, exposure_pct]
    T2: [one_off_items, recurring_view]
    T3: [capital_actions, n2_risk]
    T4: [reason_forgotten]
    T5: [suggestion, open_questions]
  eval:                          # Pass conditions of `review-eval`
    cases_file: "eval/stage2_cases.yaml"
    sources: [edinet]            # Eval documents: EDINET only (web sources change run to run and use the search quota)
    repeats: 3                   # The eval passes only when every one of this many repetitions passes (answers vary run to run)
    min_hit_rate: 0.8            # Cases answered as expected / cases
    max_parse_failures: 0        # Reviews whose reply was invalid JSON even after the re-ask
