[project]
name = "share-selection"
version = "0.1.0"
description = "Japanese stock screener based on Emin Yurumazu's investment theory"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.4.4",
    "httpx>=0.28.1",
    "numpy>=2.4.2",
    "openpyxl>=3.1.5",
    "pandas>=3.0.0",
    "pypdf>=6.20.1",
    "python-dotenv>=1.2.4",
    "pyyaml>=6.0.3",
    "tqdm>=4.67.2",
    "yfinance>=1.1.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=6.0.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    "pre-commit>=4.0.0",
    "types-PyYAML>=6.0.0",
    "pandas-stubs>=2.2.0",
    "vulture>=2.16",
    "deptry>=0.25.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "--cov=src --cov-report=term-missing --strict-markers"
markers = [
    "unit: one class or function, no DB, files or network",
    "integration: a component with real collaborators (temp DuckDB, temp files, mocked HTTP)",
    "e2e: CLI command flows through main.py",
]

[tool.coverage.report]
fail_under = 85

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "PLR2004", "C901", "PLR0912", "PLR0913", "PLR0915"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PLR2004"]

[tool.vulture]
paths = ["src", "main.py"]
min_confidence = 60
ignore_names = ["handle_*"]  # html.parser callbacks

[tool.deptry.per_rule_ignores]
DEP002 = ["openpyxl"]  # engine used by pandas.read_excel (tickers command)

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true

[tool.code_budget]
max_source_lines = 2113
