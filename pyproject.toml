[project]
name = "share-selection"
version = "0.1.0"
description = "Japanese stock screener based on Emin Yurumazu's investment theory"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.4.4",
    "openpyxl>=3.1.5",
    "pandas>=3.0.0",
    "pyyaml>=6.0.3",
    "tqdm>=4.67.2",
    "yfinance>=1.1.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=6.0.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "--cov=src --cov-report=term-missing"

[tool.coverage.report]
fail_under = 85
